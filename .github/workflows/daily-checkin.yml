name: Daily 52frp Check-in

# 注意：定时签到已迁到香港服务器的 cron（每天北京时间 11:15）。
# GitHub-hosted runner 在 Azure 海外，到 52frp 的 ESA 源站长期 5xx，跑不通。
# 这个 workflow 只保留手动触发，作为备份通道。
on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 签到方式（方法A 纯 API 已移除，仅保留兼容）
        required: false
        default: browser
        type: choice
        options:
          - browser
          - auto

jobs:
  checkin:
    name: 52frp 签到
    runs-on: ubuntu-latest
    # 签到脚本最多跑 3 轮（见 src/browser.js），每轮之间会等待退避，预留充足余量
    timeout-minutes: 30
    concurrency:
      group: 52frp-checkin
      cancel-in-progress: false
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
      options: --user root --shm-size=2gb
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: node node_modules/playwright/cli.js install chromium
      - name: Run check-in
        id: checkin
        env:
          FRP_USERNAME: ${{ secrets.FRP_USERNAME }}
          FRP_PASSWORD: ${{ secrets.FRP_PASSWORD }}
          # 与服务器保持一致：chromium + 无头（默认值就是这两个，写出来是为了明确）
          FRP_BROWSER_CHANNEL: chromium
          FRP_BROWSER_HEADLESS: 'true'
          FRP_DEBUG_DIR: debug-artifacts
          CHECKIN_STRATEGY: ${{ github.event.inputs.strategy || 'browser' }}
        run: |
          set +e
          output=$(node checkin-v2.js 2>&1)
          status=$?
          set -e
          echo "$output"
          result=$(printf '%s\n' "$output" | sed -n '/^CHECKIN_RESULT: /,$ { s/^CHECKIN_RESULT: //; p; }')
          [ -z "$result" ] && result="签到脚本执行完成，但未解析到结果"
          {
            echo "checkin_result<<EOF"
            echo "$result"
            echo "EOF"
            echo "exit_code=$status"
          } >> "$GITHUB_OUTPUT"
          exit $status
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: 52frp-debug-artifacts
          path: debug-artifacts/
          if-no-files-found: ignore
      - name: Send notifications
        if: always()
        env:
          # 账号标识（推送正文里会脱敏后展示），不配则显示「未配置」
          FRP_USERNAME: ${{ secrets.FRP_USERNAME }}
          # 推送渠道：只填用到的即可，未配置的渠道会自动跳过
          SENDKEY: ${{ secrets.SENDKEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_CHANNEL: ${{ secrets.PUSHPLUS_CHANNEL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          WECOM_BOT_WEBHOOK: ${{ secrets.WECOM_BOT_WEBHOOK }}
          YUNHU_TOKEN: ${{ secrets.YUNHU_TOKEN }}
          YUNHU_RECV_ID: ${{ secrets.YUNHU_RECV_ID }}
          YUNHU_RECV_TYPE: ${{ secrets.YUNHU_RECV_TYPE }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          BARK_GROUP: ${{ secrets.BARK_GROUP }}
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          WXPUSHER_TOPIC_IDS: ${{ secrets.WXPUSHER_TOPIC_IDS }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_METHOD: ${{ secrets.WEBHOOK_METHOD }}
          WEBHOOK_CONTENT_TYPE: ${{ secrets.WEBHOOK_CONTENT_TYPE }}
          WEBHOOK_HEADERS: ${{ secrets.WEBHOOK_HEADERS }}
          WEBHOOK_BODY: ${{ secrets.WEBHOOK_BODY }}
          # 推送调优（可选，走仓库 Variables；不配则用默认值）
          PUSH_TIMEOUT_MS: ${{ vars.PUSH_TIMEOUT_MS }}
          PUSH_MAX_RETRY: ${{ vars.PUSH_MAX_RETRY }}
          PUSH_STRICT: ${{ vars.PUSH_STRICT }}
          CHECKIN_MESSAGE: ${{ steps.checkin.outputs.checkin_result }}
        run: node push_notification.js "$CHECKIN_MESSAGE"