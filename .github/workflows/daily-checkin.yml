name: Daily 52frp Check-in

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 签到方式顺序
        required: false
        default: auto
        type: choice
        options:
          - auto
          - api
          - browser
          - browser,api
  schedule:
    # 每日签到: UTC 03:15 = 北京时间 11:15
    - cron: '15 3 * * *'
    # 每月保活: 每月1号 UTC 00:00 = 北京时间 08:00
    - cron: '0 0 1 * *'

jobs:
  checkin:
    name: 52frp 签到
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.event.schedule != '0 0 1 * *'
    # 签到脚本最多跑 3 轮（见 src/browser.js），每轮之间会等待退避，预留充足余量
    timeout-minutes: 30
    concurrency:
      group: 52frp-checkin
      cancel-in-progress: false
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
      options: --user root --shm-size=2gb
    env:
      DISPLAY: :99
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac &
          sleep 2
      - name: Run check-in
        id: checkin
        env:
          FRP_USERNAME: ${{ secrets.FRP_USERNAME }}
          FRP_PASSWORD: ${{ secrets.FRP_PASSWORD }}
          FRP_BROWSER_HEADLESS: 'false'
          FRP_BROWSER_CHANNEL: chromium
          FRP_DEBUG_DIR: debug-artifacts
          # auto = 方法A(纯API) 优先，失败回退方法B(浏览器)；手动运行时可覆盖
          CHECKIN_STRATEGY: ${{ github.event.inputs.strategy || 'auto' }}
        run: |
          set +e
          output=$(node checkin-v2.js 2>&1)
          status=$?
          set -e
          echo "$output"
          result=$(printf '%s\n' "$output" | sed -n '/^CHECKIN_RESULT: /,$ { s/^CHECKIN_RESULT: //; p; }')
          [ -z "$result" ] && result="签到脚本执行完成，但未解析到结果"
          {
            echo "checkin_result<<EOF"
            echo "$result"
            echo "EOF"
            echo "exit_code=$status"
          } >> "$GITHUB_OUTPUT"
          exit $status
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: 52frp-debug-artifacts
          path: debug-artifacts/
          if-no-files-found: ignore
      - name: Send notifications
        if: always()
        env:
          # 账号标识（推送正文里会脱敏后展示），不配则显示「未配置」
          FRP_USERNAME: ${{ secrets.FRP_USERNAME }}
          # 推送渠道：只填用到的即可，未配置的渠道会自动跳过
          SENDKEY: ${{ secrets.SENDKEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_CHANNEL: ${{ secrets.PUSHPLUS_CHANNEL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          WECOM_BOT_WEBHOOK: ${{ secrets.WECOM_BOT_WEBHOOK }}
          YUNHU_TOKEN: ${{ secrets.YUNHU_TOKEN }}
          YUNHU_RECV_ID: ${{ secrets.YUNHU_RECV_ID }}
          YUNHU_RECV_TYPE: ${{ secrets.YUNHU_RECV_TYPE }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          BARK_GROUP: ${{ secrets.BARK_GROUP }}
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          WXPUSHER_TOPIC_IDS: ${{ secrets.WXPUSHER_TOPIC_IDS }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_METHOD: ${{ secrets.WEBHOOK_METHOD }}
          WEBHOOK_CONTENT_TYPE: ${{ secrets.WEBHOOK_CONTENT_TYPE }}
          WEBHOOK_HEADERS: ${{ secrets.WEBHOOK_HEADERS }}
          WEBHOOK_BODY: ${{ secrets.WEBHOOK_BODY }}
          # 推送调优（可选，走仓库 Variables；不配则用默认值）
          PUSH_TIMEOUT_MS: ${{ vars.PUSH_TIMEOUT_MS }}
          PUSH_MAX_RETRY: ${{ vars.PUSH_MAX_RETRY }}
          PUSH_STRICT: ${{ vars.PUSH_STRICT }}
          CHECKIN_MESSAGE: ${{ steps.checkin.outputs.checkin_result }}
        run: node push_notification.js "$CHECKIN_MESSAGE"

  keepalive:
    name: 每月空提交保活
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: 52frp-keepalive
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: 创建空提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive to prevent workflow suspension"
          git push